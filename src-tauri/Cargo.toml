[package]
name = "inercia"
version = "0.1.0"
description = "Inercia desktop approval shell"
authors = ["Alaska Elaina Gonzalez"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["process", "sync", "time"] }
tokio-tungstenite = "0.24"
