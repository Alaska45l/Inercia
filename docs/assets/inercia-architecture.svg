<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Inercia runtime architecture</title>
  <desc id="desc">Architecture diagram showing Upwork inputs, Python pipeline, SQLite storage, WebSocket API, and the Tauri approval dashboard.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2l8 4-8 4z" fill="#2f3b46"/>
    </marker>
    <style>
      .bg { fill: #f7faf7; }
      .band { fill: #ffffff; stroke: #d8e2d5; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #9fb19a; stroke-width: 2; rx: 18; }
      .green { fill: #effbe9; stroke: #5bd93f; }
      .dark { fill: #2f3b46; }
      .muted { fill: #5c6670; }
      .line { stroke: #2f3b46; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .safe { stroke: #5bd93f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .title { font: 700 25px Inter, Segoe UI, Arial, sans-serif; fill: #263238; }
      .label { font: 600 18px Inter, Segoe UI, Arial, sans-serif; fill: #263238; }
      .small { font: 15px Inter, Segoe UI, Arial, sans-serif; fill: #5c6670; }
      .tiny { font: 13px Inter, Segoe UI, Arial, sans-serif; fill: #5c6670; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <text x="56" y="62" class="title">Inercia alpha runtime: local-first proposal approval system</text>
  <text x="56" y="92" class="small">Network access is opt-in. Upwork submission remains a human action.</text>

  <rect x="44" y="126" width="1192" height="172" class="band" rx="26"/>
  <text x="72" y="164" class="label">Input boundary</text>
  <rect x="82" y="188" width="218" height="76" class="box"/>
  <text x="110" y="220" class="label">Offline RSS sample</text>
  <text x="110" y="246" class="tiny">Default when network is off</text>
  <rect x="380" y="188" width="254" height="76" class="green box"/>
  <text x="408" y="220" class="label">Authenticated Upwork search</text>
  <text x="408" y="246" class="tiny">Requires manual session profile</text>
  <rect x="714" y="188" width="216" height="76" class="box"/>
  <text x="742" y="220" class="label">Job detail extractor</text>
  <text x="742" y="246" class="tiny">Markdown text normalization</text>
  <rect x="1010" y="188" width="166" height="76" class="box"/>
  <text x="1038" y="220" class="label">SQLite WAL</text>
  <text x="1038" y="246" class="tiny">Jobs and settings</text>

  <path class="line" d="M300 226h70"/>
  <path class="safe" d="M634 226h70"/>
  <path class="line" d="M930 226h70"/>

  <rect x="44" y="332" width="1192" height="188" class="band" rx="26"/>
  <text x="72" y="370" class="label">Proposal pipeline</text>
  <rect x="82" y="402" width="212" height="82" class="box"/>
  <text x="110" y="434" class="label">Extractor</text>
  <text x="110" y="460" class="tiny">Gemini Flash or fallback</text>
  <rect x="354" y="402" width="212" height="82" class="box"/>
  <text x="382" y="434" class="label">Investor</text>
  <text x="382" y="460" class="tiny">Deterministic ROI and floors</text>
  <rect x="626" y="402" width="212" height="82" class="box"/>
  <text x="654" y="434" class="label">Copywriter</text>
  <text x="654" y="460" class="tiny">OpenCode, Gemini, or fallback</text>
  <rect x="898" y="402" width="212" height="82" class="box"/>
  <text x="926" y="434" class="label">Critic</text>
  <text x="926" y="460" class="tiny">Max 2 copywriter attempts</text>
  <path class="line" d="M294 443h50"/>
  <path class="line" d="M566 443h50"/>
  <path class="line" d="M838 443h50"/>
  <path class="safe" d="M1074 402c45-54 45-118 0-168"/>
  <text x="1088" y="340" class="tiny">ready proposals</text>

  <rect x="44" y="554" width="1192" height="140" class="band" rx="26"/>
  <text x="72" y="592" class="label">Approval boundary</text>
  <rect x="94" y="620" width="234" height="48" class="green box"/>
  <text x="122" y="651" class="label">WebSocket API</text>
  <rect x="434" y="620" width="256" height="48" class="box"/>
  <text x="462" y="651" class="label">Tauri + Svelte dashboard</text>
  <rect x="796" y="620" width="322" height="48" class="box"/>
  <text x="824" y="651" class="label">Visible Upwork apply form</text>
  <path class="line" d="M328 644h96"/>
  <path class="safe" d="M690 644h96"/>
  <text x="838" y="690" class="small">Prepared form stops before Submit</text>
</svg>
